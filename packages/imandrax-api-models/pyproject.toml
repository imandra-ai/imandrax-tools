[project]
name = "imandrax-api-models"
version = "20.8.1"
description = "Pydantic model definitions for imandrax-api. Also provides a client wrapper with built-in validation and utility methods."
readme = "README.md"
authors = [
    { name = "hongyu", email = "hongyu@imandra.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "devtools>=0.12.2",
    "imandrax-api[async]>=0.20.2.2,<0.21",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
client = [
    "iml-query>=0.14.0",
]
tracing = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
]

[project.scripts]
imandrax = "imandrax_api_models.extended_cli.app:app"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"


[tool.uv.sources]
# imandrax-api = { path = "../../../imandrax-api/src/py" }

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "inline-snapshot[dirty-equals]>=0.31.1",
    "ipykernel>=7.1.0",
    "jupytext>=1.19.1",
    "marimo>=0.23.0",
    "pdbpp>=0.11.7",
    "pytest>=9.0.1",
    "pytest-retry>=1.7.0",
    "pyyaml>=6.0.3",
]
