name: list_operations
iml: |
  let list_check = fun xs ->
    match xs with
    | [] -> 0
    | [x] -> x
    | x :: y :: _ -> x + y
decomp_kwargs:
  name: list_check
  prune: true
  string_results: true
regions:
- model_str:
    xs: '[]'
  model_eval_str: '0'
  invariant_str: '0'
  constraints_str:
  - xs = []
- model_str:
    xs: '[0]'
  model_eval_str: '0'
  invariant_str: List.hd xs
  constraints_str:
  - xs <> []
  - List.tl xs = []
- model_str:
    xs: '[1; 0]'
  model_eval_str: '1'
  invariant_str: List.hd xs + List.hd (List.tl xs)
  constraints_str:
  - List.tl xs <> []
  - xs <> []
decomp_res:
  artifact:
    kind: mir.fun_decomp
    data: 
    api_version: v20
    storage: []
  task:
    id:
      id: task:decomp:8vO9Gt6S-z3eqX7ld17r7zdMAvoao7ZtkV9gKKjUsys=
    kind: TASK_DECOMP
  errors: []
