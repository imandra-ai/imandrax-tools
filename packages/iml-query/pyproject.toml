[project]
name = "iml-query"
version = "0.13.0"
description = "Tree-sitter based utility for parsing, querying, and manipulating IML (Imandra Model Language)."
readme = "README.md"
authors = [
    { name = "hongyu", email = "hongyu@imandra.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "devtools>=0.12.2",
    "rich>=14.1.0",
    "sexpdata>=1.0.2",
    "structlog>=25.4.0",
    "tree-sitter>=0.25.1",
    "tree-sitter-iml>=0.27",
]

[project.scripts]
iml-query = "iml_query._cli:app"

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "scripts",
]

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "imandrax-api[async]>=0.20",
    "inline-snapshot>=0.28.0",
    "ipykernel>=6.30.1",
    "pdbpp>=0.11.7",
    "pytest>=8.4.2",
    "typer>=0.25.0",
]

[tool.ty]
environment.python = "./.venv"

[tool.ty.rules]
# Handled by pyright
unsupported-operator = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
unresolved-import = "ignore"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnnecessaryTypeIgnoreComment = true
reportUnusedImport = "none"
reportUnusedExpression = false

[tool.inline-snapshot]
format-command="ruff check --fix-only --stdin-filename {filename} | ruff format --stdin-filename {filename}"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
